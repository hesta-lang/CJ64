# Rebuild the known-good Character Select rig package; never substitute the experimental FBX/Fast64 actor.
name: Build CJ64 GTA animation preview package

on:
  workflow_dispatch:
  push:
    paths:
      - "main.lua"
      - "character.lua"
      - "actors/cj/mario_geo.bin"
      - "tools/animations/**"
      - "tools/gta_idle_source_pose.json"
      - "tools/generate_cj_sm64_animations.py"
      - "tools/scale_cs_cj_actor.py"
      - "tools/normalize_cs_animation_tables.py"
      - "tools/inspect_cs_animation_node_order.py"
      - "tests/test_animation_calibration.py"
      - "tests/test_native_cs_idle_pose.py"
      - ".github/workflows/build-cj64-cs-baseline.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua validator
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 xz-utils

      - name: Reconstruct original GTA source-pose Lua table
        shell: bash
        run: |
          set -euo pipefail
          cat tools/animations/cj64_gta_direct_source.xz.b64.part-* \
            | base64 --decode \
            | xz --decompress > "$RUNNER_TEMP/cj64_gta_animations.lua"
          test -s "$RUNNER_TEMP/cj64_gta_animations.lua"
          echo "b918749df18418ee97e69b8e9e0f750be8b5e00aa2403aae024a430ded02b601  $RUNNER_TEMP/cj64_gta_animations.lua" | sha256sum -c -
          luac5.4 -p "$RUNNER_TEMP/cj64_gta_animations.lua"
          python3 - "$RUNNER_TEMP/cj64_gta_animations.lua" tools/gta_idle_source_pose.json <<'PY'
          import json, math, pathlib, re, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          pose = json.load(open(sys.argv[2], encoding="utf-8"))
          assert pose["format"] == "cj64-gta-idle-source-rest-v1"
          assert pose["node_count"] == 20 and len(pose["nodes"]) == 20
          assert "CJ64_NATIVE_MARIO_IDLE_POSE_ANCHOR_APPLIED" not in source
          assert "MARIO_ANIM_IDLE_HEAD_CENTER" not in source
          registration = re.compile(
              r'smlua_anim_util_register_animation\(\s*"(?P<name>[^"]+)"\s*,\s*'
              r'(?P<header>.*?)\s*,\s*\{\s*(?P<values>.*?)\s*\},\s*'
              r'\{\s*(?P<indices>.*?)\s*\}\s*\)', re.S
          )
          found = list(registration.finditer(source))
          expected = {
              "cj64_anim_idle", "cj64_anim_walk_start", "cj64_anim_walk",
              "cj64_anim_run", "cj64_anim_sprint_candidate", "cj64_anim_run_stop",
              "cj64_anim_jump_start", "cj64_anim_jump_air", "cj64_anim_jump_land",
              "cj64_anim_fall", "cj64_anim_fall_air", "cj64_anim_fall_land",
              "cj64_anim_swim_tread",
          }
          assert len(found) == 13 and {item.group("name") for item in found} == expected
          idle = next(item for item in found if item.group("name") == "cj64_anim_idle")
          values = [int(v, 16) for v in re.findall(r'0x([0-9A-Fa-f]{1,4})', idle.group("values"))]
          indices = [int(v, 16) for v in re.findall(r'0x([0-9A-Fa-f]{1,4})', idle.group("indices"))]
          assert len(indices) == 126
          def decode(v):
              signed = v - 65536 if v >= 32768 else v
              return signed * (2 * math.pi / 65536)
          def q_from_euler(rx, ry, rz):
              cr, sr = math.cos(rx/2), math.sin(rx/2)
              cp, sp = math.cos(ry/2), math.sin(ry/2)
              cy, sy = math.cos(rz/2), math.sin(rz/2)
              q = (sr*cp*cy-cr*sp*sy, cr*sp*cy+sr*cp*sy,
                   cr*cp*sy-sr*sp*cy, cr*cp*cy+sr*sp*sy)
              n = math.sqrt(sum(v*v for v in q))
              return [v/n for v in q]
          max_error = 0.0
          for node_index, item in enumerate(pose["nodes"]):
              angles = []
              for axis in range(3):
                  count, offset = indices[(3 + node_index*3 + axis)*2:(3 + node_index*3 + axis)*2+2]
                  assert count == 46
                  angles.append(decode(values[offset]))
              actual = q_from_euler(*angles)
              expected_q = item["base_rotation_xyzw"]
              dot = abs(sum(a*b for a,b in zip(actual, expected_q)))
              dot = max(-1.0, min(1.0, dot))
              max_error = max(max_error, 2*math.acos(dot))
          assert max_error < math.radians(0.02), max_error
          for item in found:
              name = item.group("name")
              values = [int(v, 16) for v in re.findall(r'0x([0-9A-Fa-f]{1,4})', item.group("values"))]
              indices = [int(v, 16) for v in re.findall(r'0x([0-9A-Fa-f]{1,4})', item.group("indices"))]
              assert len(indices) == 126, (name, len(indices))
              for channel in range(63):
                  count, offset = indices[channel*2:channel*2+2]
                  assert count > 0 and offset + count <= len(values), (name, channel)
              for axis in range(3):
                  count, offset = indices[axis*2:axis*2+2]
                  assert count == 1 and values[offset] == 0, (name, axis)
          print(f"Validated 13 original GTA pose clips, 20 CS parts; source idle pose residual {math.degrees(max_error):.5f} degrees; no Mario C5 anchor.")
          PY

      - name: Run animation calibration regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify GTA animation override handling
        run: lua5.4 tests/test_animation_hook.lua

      - name: Validate CS animation node traversal
        run: |
          set -euo pipefail
          python3 tools/inspect_cs_animation_node_order.py
          python3 - <<'PY'
          import json
          report = json.load(open("build/cs-cj-animation-node-report.json", encoding="utf-8"))
          assert report["animated_part_count"] == 20
          assert report["landmark_checks"] == 11
          assert report["status"] == "ORDERED_20_NODE_LAYOUT_MATCHES_FAST64_REFERENCE"
          assert report["rotation_basis_validation"] == "NOT_VALIDATED"
          print("Verified 20-node traversal and 11 part landmarks; local rest-axis equivalence is still experimental.")
          PY

      - name: Validate controller and CS actor
        shell: bash
        run: |
          set -euo pipefail
          luac5.4 -p main.lua character.lua
          python3 - <<'PY'
          import json
          import pathlib
          import struct
          import sys
          import zlib

          sys.path.insert(0, "tools")
          from scale_cs_cj_actor import read_words, command_length

          main = pathlib.Path("main.lua").read_text(encoding="utf-8")
          character = pathlib.Path("character.lua").read_text(encoding="utf-8")
          assert 'CJ64.version = "0.2.2-alpha"' in main
          assert 'CJ64.useGTAAnimations = true' in main
          assert 'CJ64.useGTAAnimations ~= true' in character
          assert 'require, "cj64_gta_animations"' in main
          assert 'if CJ64.useGTAAnimations == true then' in main

          actor_path = pathlib.Path("actors/cj/mario_geo.bin")
          data = actor_path.read_bytes()
          assert data[:8] == b"DYNOSBIN", "Actor is not a DynOS binary"
          raw = zlib.decompress(data[16:])
          assert len(raw) == struct.unpack_from("<I", data, 8)[0], "DynOS size header mismatch"
          assert b"cj_geo" in raw, "Expected CS CJ GeoLayout not found"

          words, offsets, _ = read_words(raw, "cj_geo")
          animated_parts = 0
          root_scale = None
          i = 0
          while i < len(words):
              if words[i][0] != "WORD":
                  i += 1
                  continue
              command = words[i][1]
              op, params = command & 0xFF, (command >> 8) & 0xFF
              length = command_length(op, params)
              if op == 0x13:
                  animated_parts += 1
              if op == 0x1D and root_scale is None:
                  root_scale = words[i + 1][1] / 65536.0
              i += length

          assert animated_parts == 20, f"Expected 20 animated parts, got {animated_parts}"
          assert root_scale is not None and abs(root_scale - 0.39) < 0.001, root_scale
          print(json.dumps({
              "actor": str(actor_path),
              "actor_bytes": len(data),
              "internal_geolayout": "cj_geo",
              "registered_filename": "mario_geo.bin",
              "animated_part_nodes": animated_parts,
              "root_scale": root_scale,
              "custom_gta_animations": "enabled_gta_source_idle_pose_no_mario_anchor",
              "status": "STRUCTURAL_PACKAGE_READY_REQUIRES_ANDROID_POSE_VALIDATION"
          }, indent=2))
          PY

      - name: Assemble self-contained SM64CoopDX mod folder
        shell: bash
        run: |
          set -euo pipefail
          MOD="$RUNNER_TEMP/CJ64-GTA-Animations-Test"
          mkdir -p "$MOD/actors"
          cp main.lua character.lua "$MOD/"
          cp "$RUNNER_TEMP/cj64_gta_animations.lua" "$MOD/cj64_gta_animations.lua"
          cp actors/cj/mario_geo.bin "$MOD/actors/mario_geo.bin"
          cat > "$MOD/README-INSTALL.txt" <<'EOF'
          CJ64 GTA ANIMATIONS TEST - 0.2.2-alpha

          Install this folder under the SM64CoopDX mods/ directory.
          The installed path must be:
            mods/CJ64-GTA-Animations-Test/main.lua
            mods/CJ64-GTA-Animations-Test/character.lua
            mods/CJ64-GTA-Animations-Test/cj64_gta_animations.lua
            mods/CJ64-GTA-Animations-Test/actors/mario_geo.bin

          This package keeps the PRE-RIGGED Character Select CJ DynOS actor from
          actors/cj/mario_geo.bin and enables 13 GTA San Andreas movement clips.
          The original GTA IDLE_stance source pose is restored on all 20 CS animated parts.
          This does NOT compose Mario anim_C5 as a pose anchor. The packaged
          actors/mario_geo.bin is byte-for-byte the original working Character Select model.
          SM64CoopDX continues to own MarioState, root movement, heading,
          collision, camera, actions and physics.

          IMPORTANT: Do NOT install CJ64-Rigged-Test.zip or CJ64-Install-Package.zip
          from the experimental FBX/Fast64 rig-transfer workflow. Do not keep the
          old CJ64-CS-Baseline installed at the same time.

          Install this folder under mods/. Before testing, remove/disable every
          older CJ64 copy that also registers mario_geo. Keep only this package
          enabled. Do not install it as a separate dynos/packs/CJ64 pack.

          The CS actor has 20 animated parts, not the full GTA ped skeleton.
          Face, finger, toe, belly and breast tracks cannot be animated separately.
          sprint_civi is the generic civilian sprint candidate. Root translation
          remains zero so the game's movement and physics stay native.

          This is an alpha preview. CI checks Lua syntax, clip tables, actor
          integrity and package contents. It cannot prove in-game pose quality;
          test walk, run, sprint, jump, fall, landing and swimming on Android.
          EOF

          python3 - "$MOD" <<'PY'
          import pathlib
          import zipfile
          import sys
          import hashlib
          source = pathlib.Path(sys.argv[1])
          output = pathlib.Path("CJ64-GTA-Animations-Test-0.2.2-alpha.zip")
          prefix = "mods/CJ64-GTA-Animations-Test"
          expected = {
              f"{prefix}/main.lua",
              f"{prefix}/character.lua",
              f"{prefix}/cj64_gta_animations.lua",
              f"{prefix}/actors/mario_geo.bin",
              f"{prefix}/README-INSTALL.txt",
          }
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, f"{prefix}/{path.relative_to(source).as_posix()}")
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              actual = set(archive.namelist())
              assert actual == expected, f"ZIP entries mismatch: {actual ^ expected}"
              animation_module = archive.read(f"{prefix}/cj64_gta_animations.lua").decode("utf-8")
              assert animation_module.count("smlua_anim_util_register_animation(") == 13
              packed_actor = archive.read(f"{prefix}/actors/mario_geo.bin")
              source_actor = pathlib.Path("actors/cj/mario_geo.bin").read_bytes()
              assert packed_actor == source_actor, "Package does not contain the original CS actor binary"
              assert hashlib.sha256(packed_actor).digest() == hashlib.sha256(source_actor).digest()
              assert archive.getinfo(f"{prefix}/actors/mario_geo.bin").file_size > 1000
              assert hashlib.sha256(packed_actor).hexdigest() == "1e85ef10af95a94d14cf014589811e74adeb437c4e9439eb88d1d3b87b4d0ce4"
          print(f"CS actor SHA256: {hashlib.sha256(source_actor).hexdigest()}")
          print(f"Created {output} ({output.stat().st_size} bytes)")
          print("\n".join(sorted(expected)))
          PY

      - name: Upload baseline test package
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-GTA-Animations-Test-0.2.2-alpha
          path: CJ64-GTA-Animations-Test-0.2.2-alpha.zip
          if-no-files-found: error
          retention-days: 14
