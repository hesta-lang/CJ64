# Build the original Character Select actor with corrected Body root and direct GTA XYZ clips.
name: Build CJ64 GTA animation preview with CS Body root alignment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "main.lua"
      - "character.lua"
      - "actors/cj/mario_geo.bin"
      - "tools/animations/cj64_gta_direct_source.xz.b64.part-*"
      - "tools/gta_idle_source_pose.json"
      - "tools/native_mario_idle_pose.json"
      - "tools/convert_direct_gta_to_sm64_xyz.py"
      - "tools/apply_cs_body_root_orientation.py"
      - "tests/test_direct_gta_sm64_xyz.py"
      - "tests/test_cs_body_root_orientation.py"
      - ".github/workflows/build-cj64-cs-baseline.yml"
  push:
    branches:
      - main
      - cj64-gta-direct-sm64-zxy-alpha
    paths:
      - "main.lua"
      - "character.lua"
      - "actors/cj/mario_geo.bin"
      - "tools/animations/cj64_gta_direct_source.xz.b64.part-*"
      - "tools/gta_idle_source_pose.json"
      - "tools/native_mario_idle_pose.json"
      - "tools/convert_direct_gta_to_sm64_xyz.py"
      - "tools/apply_cs_body_root_orientation.py"
      - "tests/test_direct_gta_sm64_xyz.py"
      - "tests/test_cs_body_root_orientation.py"
      - ".github/workflows/build-cj64-cs-baseline.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and XZ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 xz-utils

      - name: Reconstruct the original direct GTA source-pose table
        shell: bash
        run: |
          set -euo pipefail
          cat tools/animations/cj64_gta_direct_source.xz.b64.part-* \
            | base64 --decode \
            | xz --decompress > "$RUNNER_TEMP/cj64-gta-direct-source.lua"
          test -s "$RUNNER_TEMP/cj64-gta-direct-source.lua"
          echo "b918749df18418ee97e69b8e9e0f750be8b5e00aa2403aae024a430ded02b601  $RUNNER_TEMP/cj64-gta-direct-source.lua" \
            | sha256sum -c -

      - name: Preserve original GTA XYZ channels
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/convert_direct_gta_to_sm64_xyz.py \
            "$RUNNER_TEMP/cj64-gta-direct-source.lua" \
            --pose tools/gta_idle_source_pose.json \
            --output "$RUNNER_TEMP/cj64_gta_animations_xyz.lua"
          test -s "$RUNNER_TEMP/cj64_gta_animations_xyz.lua"
          test -s "$RUNNER_TEMP/cj64_gta_animations_xyz.report.json"

      - name: Correct only the CS Body root orientation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_cs_body_root_orientation.py \
            "$RUNNER_TEMP/cj64_gta_animations_xyz.lua" \
            --pose tools/native_mario_idle_pose.json \
            --output "$RUNNER_TEMP/cj64_gta_animations.lua" \
            --expected-clips 13
          test -s "$RUNNER_TEMP/cj64_gta_animations.lua"
          test -s "$RUNNER_TEMP/cj64_gta_animations.body-root-report.json"
          luac5.4 -p "$RUNNER_TEMP/cj64_gta_animations.lua"

      - name: Run Python and Lua regression tests
        run: |
          python3 -m py_compile tools/*.py
          python3 -m unittest discover -s tests -v
          lua5.4 tests/test_animation_hook.lua
          lua5.4 tests/test_animation_runtime_guard.lua

      - name: Prove that only the Body root changed
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/cj64_gta_animations_xyz.lua" "$RUNNER_TEMP/cj64_gta_animations.lua" "$RUNNER_TEMP/cj64_gta_animations.body-root-report.json" tools/native_mario_idle_pose.json <<'PY'
          import json, pathlib, sys
          from tools.convert_direct_gta_to_sm64_xyz import parse_tables
          source = parse_tables(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          fixed = parse_tables(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          report = json.loads(pathlib.Path(sys.argv[3]).read_text(encoding="utf-8"))
          native = json.loads(pathlib.Path(sys.argv[4]).read_text(encoding="utf-8"))
          body = native["nodes"][0]
          expected_body = [int(v, 16) for v in body["first_frame_euler16"]]
          assert expected_body == [0x0000, 0x3FFF, 0x0000]
          assert len(source) == len(fixed) == 13
          for before, after in zip(source, fixed):
              assert before["name"] == after["name"]
              assert before["indices"] == after["indices"]
              for axis in range(3):
                  count, offset = after["indices"][axis * 2:axis * 2 + 2]
                  assert before["values"][offset:offset + count] == [0]
                  assert after["values"][offset:offset + count] == [0]
              for axis, target in enumerate(expected_body):
                  channel = 3 + axis
                  count, offset = after["indices"][channel * 2:channel * 2 + 2]
                  assert after["values"][offset:offset + count] == [target] * count
              for node in range(1, 20):
                  for axis in range(3):
                      channel = 3 + node * 3 + axis
                      count, offset = after["indices"][channel * 2:channel * 2 + 2]
                      assert before["values"][offset:offset + count] == after["values"][offset:offset + count], (after["name"], node, axis)
          assert report["clip_count"] == 13
          assert report["node_count"] == 20
          assert report["articulated_nodes_modified"] == 0
          assert report["non_body_animation_channels"] == "preserved exactly"
          assert report["gta_body_root_orientation_replaced"] is True
          print("PASS: Body root alone was aligned to native CS anim_00.")
          print("PASS: all 19 child animated parts / their motion channels are unchanged.")
          print("PASS: all 13 clip index tables and fixed-zero root translations are unchanged.")
          PY

      - name: Validate the unchanged Character Select actor
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/inspect_cs_animation_node_order.py
          python3 - <<'PY'
          import hashlib, json, pathlib, struct, zlib
          actor = pathlib.Path("actors/cj/mario_geo.bin").read_bytes()
          assert actor[:8] == b"DYNOSBIN"
          raw = zlib.decompress(actor[16:])
          assert len(raw) == struct.unpack_from("<I", actor, 8)[0]
          digest = hashlib.sha256(actor).hexdigest()
          expected = "1e85ef10af95a94d14cf014589811e74adeb437c4e9439eb88d1d3b87b4d0ce4"
          assert digest == expected, (digest, expected)
          report = json.loads(pathlib.Path("build/cs-cj-animation-node-report.json").read_text())
          assert report["animated_part_count"] == 20
          assert report["landmark_checks"] == 11
          assert report["rotation_basis_validation"] == "NOT_VALIDATED"
          print("Original CS actor SHA-256:", digest)
          print("20 animated parts and 11 display-list landmarks verified.")
          PY

      - name: Assemble the Android-installable alpha mod
        shell: bash
        run: |
          set -euo pipefail
          MOD="$RUNNER_TEMP/CJ64-GTA-Animations-Test"
          mkdir -p "$MOD/actors"
          cp main.lua character.lua "$MOD/"
          cp "$RUNNER_TEMP/cj64_gta_animations.lua" "$MOD/cj64_gta_animations.lua"
          cp actors/cj/mario_geo.bin "$MOD/actors/mario_geo.bin"
          cat > "$MOD/README-INSTALL.txt" <<'EOF'
          CJ64 GTA ANIMATION TEST - 0.2.10-alpha

          Install this folder inside the SM64CoopDX mods/ directory.
          Expected location:
            mods/CJ64-GTA-Animations-Test/main.lua

          This test retains the original pre-rigged Character Select CJ actor.
          actors/mario_geo.bin is byte-for-byte identical to the known working CS model.
          It does NOT use the experimental FBX/Fast64 actor.

          The 13 GTA San Andreas clips retain their original XYZ rotation samples
          for all 19 articulated child parts. Only the Body root is aligned to the
          known-good native CS/Mario anim_00 frame-zero orientation (XYZ 0000, 3FFF,
          0000). GTA's Normal/root orientation is not transferred to the SM64 player
          object; world heading, movement, collision, camera and physics stay native.

          This does NOT apply the full Mario idle pose to CJ's limbs. All 19 child
          animation channels and all clip index tables are preserved.

          IMPORTANT:
          - Disable every other mod that registers mario_geo before testing this one.
          - The CS actor has only 20 animated parts, not GTA's full ped skeleton.
          - The Body-root correction is isolated; visual confirmation in SM64CoopDX
            on Android is still required.
          - The separate GTA PNG files in the repository are source assets only; this
            package does not replace textures embedded in the original CS actor.
          EOF
          luac5.4 -p "$MOD/main.lua" "$MOD/character.lua" "$MOD/cj64_gta_animations.lua"
          python3 - "$MOD" <<'PY'
          import hashlib, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path("CJ64-GTA-Animations-Test-0.2.10-alpha.zip")
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, f"mods/CJ64-GTA-Animations-Test/{path.relative_to(root).as_posix()}")
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              expected = {
                  "mods/CJ64-GTA-Animations-Test/main.lua",
                  "mods/CJ64-GTA-Animations-Test/character.lua",
                  "mods/CJ64-GTA-Animations-Test/cj64_gta_animations.lua",
                  "mods/CJ64-GTA-Animations-Test/actors/mario_geo.bin",
                  "mods/CJ64-GTA-Animations-Test/README-INSTALL.txt",
              }
              assert names == expected, (names ^ expected)
              packed_actor = archive.read("mods/CJ64-GTA-Animations-Test/actors/mario_geo.bin")
              source_actor = pathlib.Path("actors/cj/mario_geo.bin").read_bytes()
              assert hashlib.sha256(packed_actor).digest() == hashlib.sha256(source_actor).digest()
          print(f"Created {output} ({output.stat().st_size} bytes)")
          PY

      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-GTA-Animations-Test-0.2.10-alpha
          path: CJ64-GTA-Animations-Test-0.2.10-alpha.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
