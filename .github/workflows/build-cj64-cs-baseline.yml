# Experimental direct GTA source-pose package, encoded for SM64's actual ZXY joint matrix order.
name: Build CJ64 direct GTA ZXY animation preview

on:
  workflow_dispatch:
  push:
    paths:
      - "main.lua"
      - "character.lua"
      - "actors/cj/mario_geo.bin"
      - "tools/animations/cj64_gta_direct_source.xz.b64.part-*"
      - "tools/gta_idle_source_pose.json"
      - "tools/convert_direct_gta_to_sm64_zxy.py"
      - "tests/test_direct_gta_sm64_zxy.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and XZ tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 xz-utils

      - name: Reconstruct the original direct GTA source-pose table
        shell: bash
        run: |
          set -euo pipefail
          cat tools/animations/cj64_gta_direct_source.xz.b64.part-* \
            | base64 --decode \
            | xz --decompress > "$RUNNER_TEMP/cj64-gta-direct-source.lua"
          test -s "$RUNNER_TEMP/cj64-gta-direct-source.lua"
          echo "b918749df18418ee97e69b8e9e0f750be8b5e00aa2403aae024a430ded02b601  $RUNNER_TEMP/cj64-gta-direct-source.lua" \
            | sha256sum -c -

      - name: Convert source rotations to SM64 ZXY channel order
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/convert_direct_gta_to_sm64_zxy.py \
            "$RUNNER_TEMP/cj64-gta-direct-source.lua" \
            --pose tools/gta_idle_source_pose.json \
            --output "$RUNNER_TEMP/cj64_gta_animations.lua"
          test -s "$RUNNER_TEMP/cj64_gta_animations.lua"
          test -s "$RUNNER_TEMP/cj64_gta_animations.report.json"
          luac5.4 -p "$RUNNER_TEMP/cj64_gta_animations.lua"

      - name: Run all calibration and regression tests
        run: |
          python3 -m py_compile tools/*.py
          python3 -m unittest discover -s tests -v
          lua5.4 tests/test_animation_hook.lua
          lua5.4 tests/test_animation_runtime_guard.lua

      - name: Validate all 13 clips, channel ranges and source idle pose
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/cj64_gta_animations.lua" "$RUNNER_TEMP/cj64_gta_animations.report.json" <<'PY'
          import json, math, pathlib, re, sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          report = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          registration = re.compile(
              r'smlua_anim_util_register_animation\(\s*"(?P<name>[^"]+)"\s*,\s*'
              r'(?P<header>.*?)\s*,\s*\{\s*(?P<values>.*?)\s*\},\s*'
              r'\{\s*(?P<indices>.*?)\s*\}\s*\)', re.S
          )
          expected = {
              "cj64_anim_idle", "cj64_anim_walk_start", "cj64_anim_walk",
              "cj64_anim_run", "cj64_anim_sprint_candidate", "cj64_anim_run_stop",
              "cj64_anim_jump_start", "cj64_anim_jump_air", "cj64_anim_jump_land",
              "cj64_anim_fall", "cj64_anim_fall_air", "cj64_anim_fall_land",
              "cj64_anim_swim_tread",
          }
          found = list(registration.finditer(source))
          assert len(found) == 13
          assert {item.group("name") for item in found} == expected
          assert "CJ64_CS_GTA_DIRECT_SM64_ZXY_CHANNEL_ORDER_APPLIED" in source
          assert "CJ64_NATIVE_MARIO_IDLE_POSE_ANCHOR_APPLIED" not in source
          assert "CJ64_CS_DEFAULT_IDLE_POSE_ANCHOR_APPLIED" not in source
          assert report["clip_count"] == 13
          assert report["mario_pose_anchor_applied"] is False
          assert report["gta_idle_frame_zero_max_error_radians"] < math.radians(0.02)
          assert report["max_frame_quantization_error_radians"] < math.radians(0.02)
          assert report["status"].endswith("REQUIRES_ANDROID_VISUAL_CHECK")
          for item in found:
              name = item.group("name")
              values = [int(v, 16) for v in re.findall(r'0x([0-9A-Fa-f]{1,4})', item.group("values"))]
              indices = [int(v, 16) for v in re.findall(r'0x([0-9A-Fa-f]{1,4})', item.group("indices"))]
              assert len(indices) == 126, (name, len(indices))
              for channel in range(63):
                  count, offset = indices[channel * 2:channel * 2 + 2]
                  assert count > 0 and offset + count <= len(values), (name, channel)
              for axis in range(3):
                  count, offset = indices[axis * 2:axis * 2 + 2]
                  assert count == 1 and values[offset] == 0, (name, axis)
              declared = int(item.group("header").split(",")[-1].strip(), 0) + 1
              for node in range(20):
                  counts = [indices[(3 + node * 3 + axis) * 2] for axis in range(3)]
                  assert counts == [declared] * 3, (name, node, counts, declared)
          print("Validated direct GTA pose, 13 clips, 20 CS nodes, zero root movement and SM64 ZXY encoding.")
          print("Idle pose error:", math.degrees(report["gta_idle_frame_zero_max_error_radians"]), "degrees")
          PY

      - name: Validate the unchanged Character Select actor
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/inspect_cs_animation_node_order.py
          python3 - <<'PY'
          import hashlib, json, pathlib, struct, zlib
          actor = pathlib.Path("actors/cj/mario_geo.bin").read_bytes()
          assert actor[:8] == b"DYNOSBIN"
          raw = zlib.decompress(actor[16:])
          assert len(raw) == struct.unpack_from("<I", actor, 8)[0]
          digest = hashlib.sha256(actor).hexdigest()
          expected = "1e85ef10af95a94d14cf014589811e74adeb437c4e9439eb88d1d3b87b4d0ce4"
          assert digest == expected, (digest, expected)
          report = json.loads(pathlib.Path("build/cs-cj-animation-node-report.json").read_text())
          assert report["animated_part_count"] == 20
          assert report["landmark_checks"] == 11
          assert report["rotation_basis_validation"] == "NOT_VALIDATED"
          print("Original CS actor SHA-256:", digest)
          print("20 animated parts and 11 display-list landmarks verified.")
          PY

      - name: Assemble the Android-installable alpha mod
        shell: bash
        run: |
          set -euo pipefail
          MOD="$RUNNER_TEMP/CJ64-GTA-Animations-Test"
          mkdir -p "$MOD/actors"
          cp main.lua character.lua "$MOD/"
          cp "$RUNNER_TEMP/cj64_gta_animations.lua" "$MOD/cj64_gta_animations.lua"
          cp actors/cj/mario_geo.bin "$MOD/actors/mario_geo.bin"
          cat > "$MOD/README-INSTALL.txt" <<'EOF'
          CJ64 GTA ANIMATION TEST - 0.2.8-alpha

          Install this folder inside the SM64CoopDX mods/ directory.
          Expected location:
            mods/CJ64-GTA-Animations-Test/main.lua

          This test retains the original pre-rigged Character Select CJ actor.
          actors/mario_geo.bin is byte-for-byte identical to the known working CS model.
          It does NOT use the experimental FBX/Fast64 actor.

          The 13 GTA San Andreas clips are based on the original GTA IDLE_stance
          source-pose table. The rotations are converted through quaternions and
          re-encoded for SM64's ZXY animated-part matrix order. No Mario anim_00
          or anim_C5 pose is applied as an overlay. Root translation stays zero;
          SM64CoopDX retains control of player movement, collision, camera and physics.

          IMPORTANT:
          - Disable every other mod that registers mario_geo before testing this one.
          - The CS actor has only 20 animated parts, not GTA's full ped skeleton.
          - This is an experimental alpha; visual validation in SM64CoopDX on Android is required.
          - The separate GTA PNG files in the repository are source assets only; this package
            does not replace the textures embedded in the original CS actor.
          EOF
          luac5.4 -p "$MOD/main.lua" "$MOD/character.lua" "$MOD/cj64_gta_animations.lua"
          python3 - "$MOD" <<'PY'
          import hashlib, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          output = pathlib.Path("CJ64-GTA-Animations-Test-0.2.8-alpha.zip")
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, f"mods/CJ64-GTA-Animations-Test/{path.relative_to(root).as_posix()}")
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              expected = {
                  "mods/CJ64-GTA-Animations-Test/main.lua",
                  "mods/CJ64-GTA-Animations-Test/character.lua",
                  "mods/CJ64-GTA-Animations-Test/cj64_gta_animations.lua",
                  "mods/CJ64-GTA-Animations-Test/actors/mario_geo.bin",
                  "mods/CJ64-GTA-Animations-Test/README-INSTALL.txt",
              }
              assert names == expected, (names ^ expected)
              packed_actor = archive.read("mods/CJ64-GTA-Animations-Test/actors/mario_geo.bin")
              source_actor = pathlib.Path("actors/cj/mario_geo.bin").read_bytes()
              assert hashlib.sha256(packed_actor).digest() == hashlib.sha256(source_actor).digest()
          print(f"Created {output} ({output.stat().st_size} bytes)")
          PY

      - name: Upload install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-GTA-Animations-Test-0.2.8-alpha
          path: CJ64-GTA-Animations-Test-0.2.8-alpha.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
