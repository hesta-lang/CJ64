name: CJ64 Mario rig inspection

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cj-retarget-prep.yml'
      - 'tools/inspect_cj_mario_rigs.py'
      - 'assets/cj/source/**'

permissions:
  contents: read

jobs:
  inspect-rigs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout CJ64
        uses: actions/checkout@v4

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxext6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 xz-utils

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if curl -fL --retry 2 --retry-delay 2 \
            https://mirror.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz \
            -o blender-4.5.16-linux-x64.tar.xz; then
            if curl -fL --retry 2 \
              https://mirror.blender.org/release/Blender4.5/blender-4.5.16.sha256 \
              -o blender-4.5.16.sha256; then
              expected="$(awk '$2 == "blender-4.5.16-linux-x64.tar.xz" {print $1}' blender-4.5.16.sha256)"
              test -n "$expected"
              echo "$expected  blender-4.5.16-linux-x64.tar.xz" | sha256sum -c -
              tar -xf blender-4.5.16-linux-x64.tar.xz
              echo "$RUNNER_TEMP/blender-4.5.16-linux-x64" >> "$GITHUB_PATH"
            else
              echo "Blender checksum unavailable; using Ubuntu Blender package for rig inspection."
              sudo apt-get install -y blender
            fi
          else
            echo "Blender mirror blocked the archive; using Ubuntu Blender package for rig inspection."
            sudo apt-get install -y blender
          fi
          if [ -x "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" ]; then
            "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --version
          else
            blender --version
          fi

      - name: Download official SM64CoopDX Mario template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-retarget-input"
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/coop-deluxe/character-template/raw/refs/heads/main/Mario%20Coop%20Model%20Template.blend' \
            -o "$RUNNER_TEMP/cj-retarget-input/Mario Coop Model Template.blend"
          test "$(stat -c %s "$RUNNER_TEMP/cj-retarget-input/Mario Coop Model Template.blend")" -gt 10000000
          test -s assets/cj/source/CarlJohnson-GTASA.FBX

      - name: Download Fast64-Coop add-on source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/coop-deluxe/fast64.git "$RUNNER_TEMP/fast64"
          test -s "$RUNNER_TEMP/fast64/__init__.py"
          echo "FAST64_ADDON_PATH=$RUNNER_TEMP/fast64" >> "$GITHUB_ENV"

      - name: Inspect both rigs and preserve source data
        run: |
          mkdir -p "$RUNNER_TEMP/cj-retarget-output"
          blender --background --factory-startup \
            --python tools/inspect_cj_mario_rigs.py -- \
            "$RUNNER_TEMP/cj-retarget-input/Mario Coop Model Template.blend" \
            assets/cj/source/CarlJohnson-GTASA.FBX \
            "$RUNNER_TEMP/cj-retarget-output"

      - name: Upload Fast64 animation node order report
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-Fast64-animation-node-order
          path: ${{ runner.temp }}/cj-retarget-output/target_animation_node_order.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
