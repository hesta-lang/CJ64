name: CJ64 Blender bridge and DynOS export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cj-model-test.yml'
      - 'tools/prepare_cj_static_glb.py.gz'
      - 'tools/export_cj_static_actor.py'
      - 'tools/fix_cj_dynos_texture_paths.py'
      - 'main.lua'
      - 'character.lua'
      - 'assets/cj/source/**'

permissions:
  contents: read

jobs:
  export-model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout CJ64
        uses: actions/checkout@v4

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxext6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 xz-utils

      - name: Install Blender 4.5.16 for ASCII FBX preparation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 --retry-delay 2 \
            https://mirror.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz \
            -o blender-4.5.16-linux-x64.tar.xz
          curl -fL --retry 3 \
            https://mirror.blender.org/release/Blender4.5/blender-4.5.16.sha256 \
            -o blender-4.5.16.sha256
          expected="$(awk '$2 == "blender-4.5.16-linux-x64.tar.xz" {print $1}' blender-4.5.16.sha256)"
          test -n "$expected"
          echo "$expected  blender-4.5.16-linux-x64.tar.xz" | sha256sum -c -
          tar -xf blender-4.5.16-linux-x64.tar.xz
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --version

      - name: Bake CJ rest pose and export textured GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-model-test"
          gzip -dc tools/prepare_cj_static_glb.py.gz > "$RUNNER_TEMP/prepare_cj_static_glb.py"
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --background --factory-startup \
            --python "$RUNNER_TEMP/prepare_cj_static_glb.py" -- \
            assets/cj/source/CarlJohnson-GTASA.FBX \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/cj-model-test"
          test -s "$RUNNER_TEMP/cj-model-test/CJ-Static-Model.glb"
          test -s "$RUNNER_TEMP/cj-model-test/CJ64-model-preview.png"

      - name: Install Blender 3.6.23 LTS for Fast64-Coop
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 --retry-delay 2 \
            https://mirror.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz \
            -o blender-3.6.23-linux-x64.tar.xz
          curl -fL --retry 3 \
            https://mirror.blender.org/release/Blender3.6/blender-3.6.23.sha256 \
            -o blender-3.6.23.sha256
          expected="$(awk '$2 == "blender-3.6.23-linux-x64.tar.xz" {print $1}' blender-3.6.23.sha256)"
          test -n "$expected"
          echo "$expected  blender-3.6.23-linux-x64.tar.xz" | sha256sum -c -
          tar -xf blender-3.6.23-linux-x64.tar.xz
          "$RUNNER_TEMP/blender-3.6.23-linux-x64/blender" --version

      - name: Download Fast64-Coop add-on
        run: |
          git clone --depth 1 https://github.com/coop-deluxe/fast64.git "$RUNNER_TEMP/fast64"
          test -s "$RUNNER_TEMP/fast64/__init__.py"
          echo "FAST64_ADDON_PATH=$RUNNER_TEMP/fast64" >> "$GITHUB_ENV"

      - name: Export static DynOS actor with Fast64-Coop
        shell: bash
        run: |
          set -euo pipefail
          cp tools/export_cj_static_actor.py "$RUNNER_TEMP/export_cj_static_actor.py"
          "$RUNNER_TEMP/blender-3.6.23-linux-x64/blender" --background --factory-startup \
            --python "$RUNNER_TEMP/export_cj_static_actor.py" -- \
            "$RUNNER_TEMP/cj-model-test/CJ-Static-Model.glb" \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/cj-model-test"

      - name: Normalize DynOS texture paths and rebuild install ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_cj_dynos_texture_paths.py \
            "$RUNNER_TEMP/cj-model-test/CJ64-Model-Test" \
            "$RUNNER_TEMP/cj-model-test"

      - name: Verify Blender bridge, geometry and DynOS package
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/cj-model-test/CJ64-Model-Test.zip"
          test -s "$RUNNER_TEMP/cj-model-test/CJ64-model-preview.png"
          test -s "$RUNNER_TEMP/cj-model-test/cj_model_test_report.json"
          test -s "$RUNNER_TEMP/cj-model-test/cj_scene_diagnostics.json"
          test -s "$RUNNER_TEMP/cj-model-test/CJ64-Blender-Scene.blend"
          test -s "$RUNNER_TEMP/cj-model-test/CJ64-3.6-GLB-Preview.png"
          test -s "$RUNNER_TEMP/cj-model-test/CJ64-3.6-TMEM-Preview.png"
          unzip -l "$RUNNER_TEMP/cj-model-test/CJ64-Model-Test.zip"
          python - "$RUNNER_TEMP/cj-model-test/cj_model_test_report.json" "$RUNNER_TEMP/cj-model-test/CJ64-Model-Test.zip" "$RUNNER_TEMP/cj-model-test/cj_scene_diagnostics.json" <<'PY'
          import json, re, sys, zipfile
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          diagnostics = json.loads(Path(sys.argv[3]).read_text())
          assert report["model_name"] == "cj_geo"
          assert report["vertex_count"] > 0 and report["polygon_count"] > 0
          assert any(x["path"].endswith("geo.inc.c") for x in report["actor_files"])
          assert any(x["path"].endswith("model.inc.c") for x in report["actor_files"])
          assert any(x["path"].endswith(".png") for x in report["actor_files"])
          assert report["renamed_texture_files"].get("upper body.rgba16.png") == "upper_body.rgba16.png"
          assert len(report["dynos_texture_includes"]) >= 4
          scene = report["blender_scene"]
          assert scene["default_cube_removed"], scene
          assert not scene["unexpected_default_cube_in_export"], scene
          assert scene["saved_blend_scene"] == "CJ64-Blender-Scene.blend"
          assert 1.88 <= scene["joined_geometry"]["dimensions"][2] <= 1.95, scene["joined_geometry"]
          assert abs(scene["visual_scale_factor"] - 1.20) < 1e-6
          assert scene["pre_fast64_blender_preview"]["path"] == "CJ64-3.6-GLB-Preview.png"
          assert len(scene["pre_fast64_blender_preview"]["mesh_materials"]) == 4
          assert report["tmem_safe_blender_preview"]["path"] == "CJ64-3.6-TMEM-Preview.png"
          texture_budget = report["texture_tmem_budget"]
          assert len(texture_budget) == 4, texture_budget
          for info in texture_budget.values():
              assert info["rgba16_bytes"] <= 4096, info
              assert info["export_size"][0] * info["export_size"][1] <= 2048, info
          for material in report["texture_settings"].values():
              assert material["large_textures_enabled"] is False, material
          assert diagnostics["default_cube_removed"]
          assert not diagnostics["unexpected_default_cube_in_export"]
          assert diagnostics["joined_geometry"] == scene["joined_geometry"]
          assert abs(diagnostics["visual_scale_factor"] - 1.20) < 1e-6
          assert report["generated_solid_fallback_materials"] == [], report["generated_solid_fallback_materials"]
          with zipfile.ZipFile(sys.argv[2]) as archive:
              members = set(archive.namelist())
              for texture in report["dynos_texture_includes"]:
                  assert f"CJ64-Model-Test/{texture}" in members, texture
              assert "CJ64-Model-Test/actors/cj/upper_body.rgba16.png" in members
              assert not any("upper body.rgba16.png" in p for p in members)
              assert "CJ64-Model-Test/actors/cj/geo.inc.c" in members
              assert "CJ64-Model-Test/actors/cj/model.inc.c" in members
              model_source = archive.read("CJ64-Model-Test/actors/cj/model.inc.c").decode()
              tile_origins = [
                  (int(s), int(t))
                  for s, t in re.findall(
                      r"gsDPLoadTile\\s*\\(\\s*\\d+\\s*,\\s*(-?\\d+)\\s*,\\s*(-?\\d+)",
                      model_source,
                  )
              ]
              assert all(s == 0 and t == 0 for s, t in tile_origins), tile_origins
          print("Blender geometry, TMEM-safe texture sizes, and zero-origin DynOS loads verified")
          PY

      - name: Upload CJ model test package and preview
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-static-model-test
          path: |
            ${{ runner.temp }}/cj-model-test/CJ64-Model-Test.zip
            ${{ runner.temp }}/cj-model-test/CJ64-model-preview.png
            ${{ runner.temp }}/cj-model-test/CJ64-3.6-GLB-Preview.png
            ${{ runner.temp }}/cj-model-test/CJ64-3.6-TMEM-Preview.png
            ${{ runner.temp }}/cj-model-test/cj_model_test_report.json
            ${{ runner.temp }}/cj-model-test/cj_scene_diagnostics.json
            ${{ runner.temp }}/cj-model-test/CJ-Static-Model.glb
            ${{ runner.temp }}/cj-model-test/CJ64-Blender-Scene.blend
          if-no-files-found: error
          retention-days: 14
