name: CJ64 rigged actor experiment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cj-rigged-model-test.yml'
      - 'tools/rig_cj_to_mario.py'
      - 'tools/export_cj_static_actor.py'
      - 'tools/prepare_cj_static_glb.py.gz'
      - 'tools/cj64_sm64_animation_retarget_map.json'
      - 'main.lua'
      - 'character.lua'
      - 'assets/cj/source/**'

permissions:
  contents: read

jobs:
  rig-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxext6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 xz-utils lua5.4
      - name: Validate Lua entry points
        run: |
          luac5.4 -p main.lua character.lua

      - name: Install Blender 4.5.16 for model preparation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://mirror.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz -o blender-4.5.16-linux-x64.tar.xz
          curl -fL --retry 3 https://mirror.blender.org/release/Blender4.5/blender-4.5.16.sha256 -o blender-4.5.16.sha256
          expected="$(awk '$2 == "blender-4.5.16-linux-x64.tar.xz" {print $1}' blender-4.5.16.sha256)"
          echo "$expected  blender-4.5.16-linux-x64.tar.xz" | sha256sum -c -
          tar -xf blender-4.5.16-linux-x64.tar.xz
      - name: Prepare textured CJ GLB
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rigged"
          gzip -dc tools/prepare_cj_static_glb.py.gz > "$RUNNER_TEMP/prepare_cj_static_glb.py"
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --background --factory-startup --python "$RUNNER_TEMP/prepare_cj_static_glb.py" -- assets/cj/source/CarlJohnson-GTASA.FBX "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cj-rigged"
          test -s "$RUNNER_TEMP/cj-rigged/CJ-Static-Model.glb"
      - name: Install Blender 3.6.23 for Fast64-Coop
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://mirror.blender.org/release/Blender3.6/blender-3.6.23-linux-x64.tar.xz -o blender-3.6.23-linux-x64.tar.xz
          curl -fL --retry 3 https://mirror.blender.org/release/Blender3.6/blender-3.6.23.sha256 -o blender-3.6.23.sha256
          expected="$(awk '$2 == "blender-3.6.23-linux-x64.tar.xz" {print $1}' blender-3.6.23.sha256)"
          echo "$expected  blender-3.6.23-linux-x64.tar.xz" | sha256sum -c -
          tar -xf blender-3.6.23-linux-x64.tar.xz
      - name: Download official Mario template and Fast64-Coop
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/coop-deluxe/character-template/raw/refs/heads/main/Mario%20Coop%20Model%20Template.blend' -o "$RUNNER_TEMP/Mario-Coop-Template.blend"
          test "$(stat -c %s "$RUNNER_TEMP/Mario-Coop-Template.blend")" -gt 10000000
          git clone --depth 1 https://github.com/coop-deluxe/fast64.git "$RUNNER_TEMP/fast64"
          echo "FAST64_ADDON_PATH=$RUNNER_TEMP/fast64" >> "$GITHUB_ENV"
      - name: Rig CJ to Mario and export Fast64 actor
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-3.6.23-linux-x64/blender" --background --factory-startup --python tools/rig_cj_to_mario.py -- \
            "$RUNNER_TEMP/Mario-Coop-Template.blend" "$RUNNER_TEMP/cj-rigged/CJ-Static-Model.glb" \
            assets/cj/source/CarlJohnson-GTASA.FBX "$GITHUB_WORKSPACE" "$RUNNER_TEMP/cj-rigged"
          test -s "$RUNNER_TEMP/cj-rigged/CJ64-Rigged-Test.zip"
          test -s "$RUNNER_TEMP/cj-rigged/CJ64-Rigged-Scene.blend"
          test -s "$RUNNER_TEMP/cj-rigged/cj64_rigged_actor_report.json"
          test -s "$RUNNER_TEMP/cj-rigged/cj64_sm64_animation_retarget_map.json"
          test -s "$RUNNER_TEMP/cj-rigged/target_animation_node_order.json"
      - name: Verify binary skinning and actor export
        run: |
          python - "$RUNNER_TEMP/cj-rigged/cj64_rigged_actor_report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["model_name"]=="cj_geo"
          assert abs(d["height_sm64_units"]-280.0)<0.01
          assert d["target_animation_node_count"]==20
          assert sum(d["vertices_by_target_bone"].values())==d["total_vertices"]
          assert d["max_nearest_source_vertex_distance"]<0.07
          print("Verified 280-unit actor and one-bone-per-vertex assignments")
          PY
      - name: Upload rigged actor experiment
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-rigged-actor-experiment
          path: |
            ${{ runner.temp }}/cj-rigged/CJ64-Rigged-Test.zip
            ${{ runner.temp }}/cj-rigged/CJ64-Rigged-Scene.blend
            ${{ runner.temp }}/cj-rigged/cj64_rigged_actor_report.json
            ${{ runner.temp }}/cj-rigged/cj64_sm64_animation_retarget_map.json
            ${{ runner.temp }}/cj-rigged/target_animation_node_order.json
          if-no-files-found: error
          retention-days: 14
