name: CJ64 rigged actor export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cj-rig-transfer.yml'
      - 'tools/inspect_cj_mario_rigs.py'
      - 'tools/prepare_cj_rig_transfer.py'
      - 'tools/export_cj_static_actor.py'
      - 'tools/fix_cj_dynos_texture_paths.py'
      - 'tools/cj64_sm64_animation_retarget_map.json'
      - 'main.lua'
      - 'character.lua'
      - 'assets/cj/source/**'

permissions:
  contents: read

jobs:
  inspect-rig-export:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxext6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 xz-utils lua5.4

      - name: Validate Lua controller
        run: |
          luac5.4 -p main.lua character.lua

      - name: Install Blender 4.5.16
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 --retry-delay 2 https://mirror.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz -o blender-4.5.16-linux-x64.tar.xz
          curl -fL --retry 3 https://mirror.blender.org/release/Blender4.5/blender-4.5.16.sha256 -o blender-4.5.16.sha256
          expected="$(awk '$2 == "blender-4.5.16-linux-x64.tar.xz" {print $1}' blender-4.5.16.sha256)"
          test -n "$expected"
          echo "$expected  blender-4.5.16-linux-x64.tar.xz" | sha256sum -c -
          tar -xf blender-4.5.16-linux-x64.tar.xz
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --version

      - name: Download Mario template and pinned Fast64-Gart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rig-input"
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/coop-deluxe/character-template/raw/refs/heads/main/Mario%20Coop%20Model%20Template.blend' \
            -o "$RUNNER_TEMP/cj-rig-input/Mario-Coop-Template.blend"
          test "$(stat -c %s "$RUNNER_TEMP/cj-rig-input/Mario-Coop-Template.blend")" -gt 10000000
          test -s assets/cj/source/CarlJohnson-GTASA.FBX

          git clone --filter=blob:none --no-checkout \
            https://github.com/ManIsCat2/Fast64-Gart.git "$RUNNER_TEMP/fast64"
          git -C "$RUNNER_TEMP/fast64" fetch --depth 1 origin \
            9384477f2ccdc8b6e05a96b52241f98808feb90b
          git -C "$RUNNER_TEMP/fast64" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/fast64" rev-parse HEAD)" = \
            "9384477f2ccdc8b6e05a96b52241f98808feb90b"
          test -s "$RUNNER_TEMP/fast64/__init__.py"
          grep -q 'Fast64 Gart Edition' "$RUNNER_TEMP/fast64/__init__.py"
          grep -q 'def is_bone_animatable' \
            "$RUNNER_TEMP/fast64/fast64_internal/sm64/sm64_geolayout_utility.py"
          grep -q 'class SM64_ExportGeolayoutArmature' \
            "$RUNNER_TEMP/fast64/fast64_internal/sm64/sm64_geolayout_writer.py"
          echo "FAST64_ADDON_PATH=$RUNNER_TEMP/fast64" >> "$GITHUB_ENV"
          echo "Fast64-Gart commit: $(git -C "$RUNNER_TEMP/fast64" rev-parse HEAD)"

      - name: Inspect CJ and Mario rigs with Blender 4.5.16
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rig-inspection"
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --background --factory-startup \
            --python tools/inspect_cj_mario_rigs.py -- \
            "$RUNNER_TEMP/cj-rig-input/Mario-Coop-Template.blend" \
            assets/cj/source/CarlJohnson-GTASA.FBX \
            "$RUNNER_TEMP/cj-rig-inspection"
          python - "$RUNNER_TEMP/cj-rig-inspection/cj_mario_rig_inspection.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["format"]=="cj64-cj-mario-rig-inspection-v3"
          assert d["fast64_addon"]=="Fast64 Gart Edition"
          assert d["fast64_version"]==[2,5,3]
          assert d["target_animation_node_count"]==20
          assert len(d["source_cj"]["armatures"])==1
          assert len(d["source_cj"]["meshes"])>=1
          print("Inspected actual CJ and Mario/Fast64-Gart rigs")
          PY

      - name: Transfer CJ skin and export through Fast64-Gart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rig-output"
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --background --factory-startup \
            --python tools/prepare_cj_rig_transfer.py -- \
            "$RUNNER_TEMP/cj-rig-input/Mario-Coop-Template.blend" \
            assets/cj/source/CarlJohnson-GTASA.FBX \
            "$RUNNER_TEMP/cj-rig-output"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-Rigged-Test.zip"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-CJ-Rig-Transfer.blend"
          test -s "$RUNNER_TEMP/cj-rig-output/cj64_rig_transfer_report.json"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-Rigged-Rest-Preview.png"
          test -s "$RUNNER_TEMP/cj-rig-output/cj64_sm64_animation_retarget_map.json"
          test -s "$RUNNER_TEMP/cj-rig-output/target_animation_node_order.json"

      - name: Normalize DynOS texture paths and rebuild rigged ZIP
        run: |
          python3 tools/fix_cj_dynos_texture_paths.py \
            "$RUNNER_TEMP/cj-rig-output/CJ64-Rigged-Test" \
            "$RUNNER_TEMP/cj-rig-output" \
            CJ64-Rigged-Test.zip cj64_rig_transfer_report.json

      - name: Validate exported actor and single-bone skinning
        run: |
          python - "$RUNNER_TEMP/cj-rig-output/cj64_rig_transfer_report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["status"]=="EXPORTED_TEXTURE_PATHS_NORMALIZED_NOT_TESTED_IN_GAME"
          assert d["fast64_addon"]=="Fast64 Gart Edition"
          assert d["fast64_version"]==[2,5,3]
          assert d["source_vertices"]>1000
          assert d["weighted_vertices"]==d["source_vertices"]
          assert d["weight_influences_per_vertex"]==1
          assert d["invalid_weight_vertices"]==0
          assert d["vertices_using_original_source_weights"]>0
          assert d["vertices_using_nearest_bone_fallback"]<=d["source_vertices"]*0.05
          assert d["target_animation_node_count"]==20
          assert abs(d["target_height_sm64_units"]-280.0)<0.1
          assert abs(d["bounds_after_armature_evaluation"][0]-2.8)<0.03
          assert any(p["path"].endswith("geo.inc.c") for p in d["actor_files"])
          assert any(p["path"].endswith("model.inc.c") for p in d["actor_files"])
          print("Fast64-Gart exported CJ: 280 units, 20 animation nodes, one deform bone per vertex.")
          PY

      - name: Upload rigged CJ actor package and authoring scene
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-rigged-actor
          path: |
            ${{ runner.temp }}/cj-rig-output/CJ64-Rigged-Test.zip
            ${{ runner.temp }}/cj-rig-output/CJ64-CJ-Rig-Transfer.blend
            ${{ runner.temp }}/cj-rig-output/cj64_rig_transfer_report.json
            ${{ runner.temp }}/cj-rig-output/CJ64-Rigged-Rest-Preview.png
            ${{ runner.temp }}/cj-rig-output/cj64_sm64_animation_retarget_map.json
            ${{ runner.temp }}/cj-rig-output/target_animation_node_order.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
