name: CJ64 rig transfer preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cj-rig-transfer.yml'
      - 'tools/prepare_cj_rig_transfer.py'

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout CJ64
        uses: actions/checkout@v4

      - name: Download inspected CJ and Mario rigs
        uses: actions/download-artifact@v4
        with:
          name: CJ64-Mario-rig-inspection
          repository: hesta-lang/CJ64
          run-id: 45058076896
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/rig-inspection

      - name: Locate Blender scene
        shell: bash
        run: |
          set -euo pipefail
          find "${{ runner.temp }}/rig-inspection" -maxdepth 3 -type f -printf '%p %s bytes\n'
          test -s "${{ runner.temp }}/rig-inspection/cj_mario_dual_rig_inspection.blend"

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxext6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 xz-utils

      - name: Install Blender 4.5.16
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 --retry-delay 2 https://mirror.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz -o blender.tar.xz
          curl -fL --retry 3 https://mirror.blender.org/release/Blender4.5/blender-4.5.16.sha256 -o blender.sha256
          expected="$(awk '$2 == "blender-4.5.16-linux-x64.tar.xz" {print $1}' blender.sha256)"
          test -n "$expected"
          echo "$expected  blender.tar.xz" | sha256sum -c -
          tar -xf blender.tar.xz
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --version

      - name: Transfer CJ skin to Mario animation hierarchy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rig-transfer"
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --background             --python tools/prepare_cj_rig_transfer.py --             "$RUNNER_TEMP/rig-inspection/cj_mario_dual_rig_inspection.blend"             "$RUNNER_TEMP/cj-rig-transfer"
          test -s "$RUNNER_TEMP/cj-rig-transfer/CJ64-CJ-Rig-Transfer.blend"
          test -s "$RUNNER_TEMP/cj-rig-transfer/cj64_rig_transfer_report.json"

      - name: Validate rig transfer
        run: |
          python - "$RUNNER_TEMP/cj-rig-transfer/cj64_rig_transfer_report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report["status"] == "RIGGED_PREVIEW_NOT_FAST64_EXPORTED_OR_IN_GAME_TESTED"
          assert report["source_vertices"] > 1000
          assert report["weighted_vertices"] == report["source_vertices"]
          assert abs(report["target_height_blender_units"] - 2.8) < 1e-6
          assert abs(report["bounds_after_armature_evaluation"][0] - 2.8) < 0.03
          assert len(report["target_vertex_groups"]) >= 15
          print("CJ skin transferred to the Mario armature; all vertices weighted and 280-unit height preserved.")
          PY

      - name: Upload rigged Blender scene and report
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-rig-transfer-preview
          path: |
            ${{ runner.temp }}/cj-rig-transfer/CJ64-CJ-Rig-Transfer.blend
            ${{ runner.temp }}/cj-rig-transfer/cj64_rig_transfer_report.json
          if-no-files-found: error
          retention-days: 14
