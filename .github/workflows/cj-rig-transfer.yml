name: CJ64 rigged actor export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cj-rig-transfer.yml'
      - 'tools/inspect_cj_mario_rigs.py'
      - 'tools/prepare_cj_rig_transfer.py'
      - 'tools/export_cj_static_actor.py'
      - 'tools/fix_cj_dynos_texture_paths.py'
      - 'tools/cj64_sm64_animation_retarget_map.json'
      - 'main.lua'
      - 'character.lua'
      - 'assets/cj/source/**'
      - 'tools/export_cj64_comparison_assets.py'
      - 'viewer/**'
      - 'docs/ANIMATION-COMPARISON-VIEWER.md'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  inspect-rig-export:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxext6 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 xz-utils lua5.4

      - name: Validate Lua controller
        run: |
          luac5.4 -p main.lua character.lua

      - name: Install Blender 4.5.16
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 --retry-delay 2 https://mirror.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz -o blender-4.5.16-linux-x64.tar.xz
          curl -fL --retry 3 https://mirror.blender.org/release/Blender4.5/blender-4.5.16.sha256 -o blender-4.5.16.sha256
          expected="$(awk '$2 == "blender-4.5.16-linux-x64.tar.xz" {print $1}' blender-4.5.16.sha256)"
          test -n "$expected"
          echo "$expected  blender-4.5.16-linux-x64.tar.xz" | sha256sum -c -
          tar -xf blender-4.5.16-linux-x64.tar.xz
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --version

      - name: Download Mario template and pinned Fast64-Gart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rig-input"
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/coop-deluxe/character-template/raw/refs/heads/main/Mario%20Coop%20Model%20Template.blend' \
            -o "$RUNNER_TEMP/cj-rig-input/Mario-Coop-Template.blend"
          test "$(stat -c %s "$RUNNER_TEMP/cj-rig-input/Mario-Coop-Template.blend")" -gt 10000000
          test -s assets/cj/source/CarlJohnson-GTASA.FBX

          git clone --filter=blob:none --no-checkout \
            https://github.com/ManIsCat2/Fast64-Gart.git "$RUNNER_TEMP/fast64"
          git -C "$RUNNER_TEMP/fast64" fetch --depth 1 origin \
            9384477f2ccdc8b6e05a96b52241f98808feb90b
          git -C "$RUNNER_TEMP/fast64" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/fast64" rev-parse HEAD)" = \
            "9384477f2ccdc8b6e05a96b52241f98808feb90b"
          test -s "$RUNNER_TEMP/fast64/__init__.py"
          grep -q 'Fast64 Gart Edition' "$RUNNER_TEMP/fast64/__init__.py"
          grep -q 'def is_bone_animatable' \
            "$RUNNER_TEMP/fast64/fast64_internal/sm64/sm64_geolayout_utility.py"
          grep -q 'class SM64_ExportGeolayoutArmature' \
            "$RUNNER_TEMP/fast64/fast64_internal/sm64/sm64_geolayout_writer.py"
          echo "FAST64_ADDON_PATH=$RUNNER_TEMP/fast64" >> "$GITHUB_ENV"
          echo "Fast64-Gart commit: $(git -C "$RUNNER_TEMP/fast64" rev-parse HEAD)"

      - name: Inspect CJ and Mario rigs with Blender 4.5.16
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rig-inspection"
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --background --factory-startup \
            --python-exit-code 1 --python tools/inspect_cj_mario_rigs.py -- \
            "$RUNNER_TEMP/cj-rig-input/Mario-Coop-Template.blend" \
            assets/cj/source/CarlJohnson-GTASA.FBX \
            "$RUNNER_TEMP/cj-rig-inspection"
          python - "$RUNNER_TEMP/cj-rig-inspection/cj_mario_rig_inspection.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["format"]=="cj64-cj-mario-rig-inspection-v3"
          assert d["fast64_addon"]=="Fast64 Gart Edition"
          assert d["fast64_version"]==[2,5,3]
          assert d["target_animation_node_count"]==20
          assert len(d["source_cj"]["armatures"])==1
          assert len(d["source_cj"]["meshes"])>=1
          print("Inspected actual CJ and Mario/Fast64-Gart rigs")
          PY

      - name: Transfer CJ skin and export through Fast64-Gart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rig-output"
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --background --factory-startup \
            --python-exit-code 1 --python tools/prepare_cj_rig_transfer.py -- \
            "$RUNNER_TEMP/cj-rig-input/Mario-Coop-Template.blend" \
            assets/cj/source/CarlJohnson-GTASA.FBX \
            "$RUNNER_TEMP/cj-rig-output"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-Rigged-Test/main.lua"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-Rigged-Test/character.lua"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64/Assets/geo.inc.c"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64/Assets/model.inc.c"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64/Assets/geo_header.h"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-CJ-Rig-Transfer.blend"
          test -s "$RUNNER_TEMP/cj-rig-output/cj64_rig_transfer_report.json"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-Rigged-Rest-Preview.png"
          test -s "$RUNNER_TEMP/cj-rig-output/cj64_sm64_animation_retarget_map.json"
          test -s "$RUNNER_TEMP/cj-rig-output/target_animation_node_order.json"

      - name: Export paired GTA and SM64 comparison models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cj-rig-output/comparison"
          "$RUNNER_TEMP/blender-4.5.16-linux-x64/blender" --background --factory-startup \
            --python-exit-code 1 --python tools/export_cj64_comparison_assets.py -- \
            assets/cj/source/CarlJohnson-GTASA.FBX \
            "$RUNNER_TEMP/cj-rig-output/CJ64-CJ-Rig-Transfer.blend" \
            "$RUNNER_TEMP/cj-rig-output/cj64_sm64_animation_retarget_map.json" \
            tools/cj_fbx_bone_map.json \
            "$RUNNER_TEMP/cj-rig-output/comparison"
          test -s "$RUNNER_TEMP/cj-rig-output/comparison/cj64-gta-source.glb"
          test -s "$RUNNER_TEMP/cj-rig-output/comparison/cj64-sm64-target.glb"
          test -s "$RUNNER_TEMP/cj-rig-output/comparison/cj64_sm64_animation_retarget_map.json"
          test -s "$RUNNER_TEMP/cj-rig-output/comparison/comparison-assets.json"
      - name: Normalize DynOS texture paths and rebuild rigged ZIP
        run: |
          python3 tools/fix_cj_dynos_texture_paths.py \
            "$RUNNER_TEMP/cj-rig-output/CJ64-Rigged-Test" \
            "$RUNNER_TEMP/cj-rig-output/CJ64" \
            "$RUNNER_TEMP/cj-rig-output" \
            cj64_rig_transfer_report.json
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-Install-Package.zip"
          test -s "$RUNNER_TEMP/cj-rig-output/CJ64-Rigged-Test.zip"

      - name: Validate exported actor and single-bone skinning
        run: |
          python - "$RUNNER_TEMP/cj-rig-output/cj64_rig_transfer_report.json" "$RUNNER_TEMP/cj-rig-output/cj64_sm64_animation_retarget_map.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          mapping=json.load(open(sys.argv[2],encoding="utf-8"))
          assert d["status"]=="MOD_EMBEDDED_DYNOS_ACTOR_SOURCE_PREFLIGHT_PASSED_NOT_TESTED_IN_GAME"
          assert d["actor_is_embedded_in_mod"] is True
          assert d["dynos_actor_install_path"]=="mods/CJ64-Rigged-Test/actors"
          assert d["fast64_addon"]=="Fast64 Gart Edition"
          assert d["fast64_version"]==[2,5,3]
          assert d["source_vertices"]>1000
          assert d["weighted_vertices"]==d["source_vertices"]
          assert d["weight_influences_per_vertex"]==1
          assert d["invalid_weight_vertices"]==0
          assert d["vertices_using_original_source_weights"]>0
          assert d["vertices_using_nearest_bone_fallback"]<=d["source_vertices"]*0.05
          assert d["target_animation_node_count"]==20
          assert d["shoulder_weight_targets"] == {
              "arm left shoulder 1": "Left Arm",
              "arm left shoulder 2": "Left Arm Color",
              "arm right shoulder 1": "Right Arm",
              "arm right shoulder 2": "Right Arm Color",
          }
          assert d["deformable_shoulder_pivots"] == {"Left Arm": True, "Right Arm": True}
          for group in ("Left Arm", "Left Arm Color", "Right Arm", "Right Arm Color"):
              assert group in d["target_vertex_groups"], group
          anim_nodes = {node["name"]: node for node in d["target_animation_nodes"]}
          assert anim_nodes["Left Arm"]["use_deform"] is True
          assert anim_nodes["Right Arm"]["use_deform"] is True
          assert mapping["source_parent_by_bone"]["arm left shoulder 1"] == "head neck lower"
          assert mapping["source_parent_by_bone"]["arm right shoulder 1"] == "head neck lower"
          assert mapping["source_parent_by_bone"]["spine lower"] == "pelvis"
          assert mapping["target_parent_animation_node"]["Left Arm"] == "Torso"
          assert mapping["target_parent_animation_node"]["Right Arm"] == "Torso"
          assert set(mapping["target_parent_rest_rotation_wxyz"]) == set(mapping["target_node_order"])
          assert d["native_mario_rest_pose_preserved"] is True
          assert d["native_mario_rest_matrix_max_error"]<1e-6
          assert d["mesh_vertices_in_source_rest_pose"]==d["source_vertices"]
          assert d["dynos_geolayout_name"]=="mario_geo"
          assert d["dynos_pack_name"] is None
          assert d["dynos_pack_install_path"] is None
          assert d["dynos_pack_actor_folder"] is None
          assert d["unsupported_custom_geo_commands_remaining"]==0
          assert abs(d["target_height_sm64_units"]-280.0)<0.1
          assert abs(d["bounds_after_armature_evaluation"][0]-2.8)<0.03
          assert any(p["path"]=="Assets/geo.inc.c" for p in d["actor_files"])
          assert any(p["path"]=="Assets/model.inc.c" for p in d["actor_files"])
          assert any(p["path"]=="Assets/geo_header.h" for p in d["actor_files"])
          print("Fast64-Gart exported CJ: 280 units, 20 animation nodes, one deform bone per vertex.")
          PY

      - name: Validate local IFP parser, retarget math and viewer scripts
        shell: bash
        run: |
          set -euo pipefail
          node --test viewer/core.test.js
          node --check viewer/app.js
          python3 -m py_compile tools/export_cj64_comparison_assets.py

      - name: Assemble paired 3D comparison viewer
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/cj-rig-output/comparison-site"
          mkdir -p "$site/assets"
          cp viewer/index.html viewer/app.js viewer/core.js viewer/style.css "$site/"
          cp "$RUNNER_TEMP/cj-rig-output/comparison/"* "$site/assets/"
          touch "$site/.nojekyll"
          python3 - "$site" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          required=[root/'index.html',root/'app.js',root/'core.js',root/'style.css',
                    root/'assets/cj64-gta-source.glb',root/'assets/cj64-sm64-target.glb',
                    root/'assets/cj64_sm64_animation_retarget_map.json',
                    root/'assets/cj_fbx_bone_map.json',root/'assets/comparison-assets.json']
          missing=[str(p) for p in required if not p.is_file() or p.stat().st_size==0]
          assert not missing, f"Incomplete viewer bundle: {missing}"
          manifest=json.loads((root/'assets/comparison-assets.json').read_text())
          assert manifest['ifp_file_embedded'] is False
          assert manifest['target_animation_node_count']==20
          assert manifest['source_model']=='cj64-gta-source.glb'
          assert manifest['target_model']=='cj64-sm64-target.glb'
          print(f"Viewer bundle contains {len(list(root.rglob('*')))} entries; original IFP is not embedded.")
          PY

      - name: Upload interactive comparison viewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-Animation-Comparison-Viewer
          path: ${{ runner.temp }}/cj-rig-output/comparison-site
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/cj-rig-output/comparison-site

      - name: Deploy interactive comparison viewer to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Publish viewer URL or setup instructions in summary
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ -n "$DEPLOY_URL" ]; then
            echo "## CJ64 animation comparison viewer" >> "$GITHUB_STEP_SUMMARY"
            echo "[Open the interactive GTA / SM64 comparison]($DEPLOY_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CJ64 animation comparison viewer" >> "$GITHUB_STEP_SUMMARY"
            echo "The viewer artifact was generated. To publish a permanent page, open Repository Settings → Pages and set Build and deployment Source to GitHub Actions, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload rigged CJ actor package and authoring scene
        uses: actions/upload-artifact@v4
        with:
          name: CJ64-rigged-actor
          path: |
            ${{ runner.temp }}/cj-rig-output/CJ64-Install-Package.zip
            ${{ runner.temp }}/cj-rig-output/CJ64-Rigged-Test.zip
            ${{ runner.temp }}/cj-rig-output/CJ64-CJ-Rig-Transfer.blend
            ${{ runner.temp }}/cj-rig-output/cj64_rig_transfer_report.json
            ${{ runner.temp }}/cj-rig-output/CJ64-Rigged-Rest-Preview.png
            ${{ runner.temp }}/cj-rig-output/cj64_sm64_animation_retarget_map.json
            ${{ runner.temp }}/cj-rig-output/target_animation_node_order.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
